name: Smart XOR Decrypt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Проверить наличие папок
        run: |
          if [ ! -d "output_jadx" ] || [ ! -d "output_apktool" ]; then
            echo "❌ Сначала запустите декомпиляцию!"
            exit 1
          fi

      - name: Умная расшифровка XOR
        run: |
          cat > smart_xor.py << 'PYEOF'
          import os, re

          def xor_decrypt(data, key):
              result = bytearray(data)
              key_len = len(key)
              for i in range(len(result)):
                  result[i] ^= key[i % key_len]
              try:
                  return result.decode('utf-8').strip()
              except:
                  return result.decode('utf-8', errors='ignore').strip()

          def parse_byte_array(s):
              s = s.replace('new byte[]', '').replace('{', '').replace('}', '').replace(' ', '')
              if not s: return []
              res = []
              for p in s.split(','):
                  p = p.strip()
                  if p.startswith('0x') or p.startswith('0X'):
                      val = int(p, 16)
                      if val > 127: val -= 256
                      res.append(val)
                  else:
                      res.append(int(p))
              return bytes(res)

          def main():
              os.makedirs('decrypted_xor', exist_ok=True)
              results = []
              
              # Ищем вызовы метода h с байтовыми массивами в Java-коде
              for root, _, files in os.walk('output_jadx/sources'):
                  for file in files:
                      if not file.endswith('.java'): continue
                      fp = os.path.join(root, file)
                      try:
                          with open(fp, 'r', encoding='utf-8', errors='ignore') as f:
                              lines = f.readlines()
                          
                          for i, line in enumerate(lines):
                              if 'h(new byte[]' in line and 'new byte[]' in line:
                                  context = "".join(lines[max(0,i-2):min(len(lines),i+3)])
                                  arrays = re.findall(r'new byte\[\]\s*\{[^}]+\}', context)
                                  if len(arrays) >= 2:
                                      data_arr = parse_byte_array(arrays[0])
                                      key_arr = parse_byte_array(arrays[1])
                                      
                                      if len(data_arr) > 0 and len(key_arr) > 0:
                                          decrypted = xor_decrypt(data_arr, key_arr)
                                          # Фильтр мусора: оставляем только строки с буквами и длиной > 3
                                          if any(c.isalpha() for c in decrypted) and len(decrypted) > 3:
                                              results.append({
                                                  'file': fp.replace('output_jadx/sources/', ''),
                                                  'line': i+1,
                                                  'decrypted': decrypted
                                              })
                      except: pass

              # Сохраняем чистые результаты
              with open('decrypted_xor/real_decrypted.txt', 'w', encoding='utf-8') as out:
                  out.write(f"✅ Успешно расшифровано: {len(results)} реальных строк\n\n")
                  for i, r in enumerate(results, 1):
                      out.write(f"#{i} | {r['file']}:{r['line']}\n")
                      out.write(f"🔓 {r['decrypted']}\n")
                      out.write("-" * 70 + "\n")
              
              print(f"Готово! Найдено {len(results)} реальных расшифровок.")

          if __name__ == "__main__":
              main()
          PYEOF
          python3 smart_xor.py

      - name: Commit и Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add decrypted_xor
          if ! git diff --staged --quiet; then
            git commit -m "chore: умная расшифровка XOR (алгоритм e0.m.h)"
            git push
          fi

      - name: Очистка
        run: rm -f smart_xor.py
