name: Decrypt ALL XOR Strings (FAST)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decrypt_all:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Проверить наличие папок
        run: |
          if [ ! -d "output_apktool" ]; then
            echo "❌ Папка output_apktool не найдена!"
            exit 1
          fi

      - name: Молниеносная расшифровка XOR
        run: |
          echo "🔍 Поиск файлов с вызовами расшифровки (grep)..."
          # Ищем только файлы, где реально есть вызовы методов расшифровки
          grep -rIlE "Le0/m;->h\(|Lcom/google/protobuf/q;->(i|l)\(" output_apktool/smali/ > candidates.txt || true
          
          CANDIDATE_COUNT=$(wc -l < candidates.txt)
          echo "✅ Найдено файлов-кандидатов: $CANDIDATE_COUNT"

          cat > fast_decrypt.py << 'PYEOF'
          import os, re, sys

          def xor_decrypt(data, key):
              result = bytearray(data)
              key_len = len(key)
              for i in range(len(result)):
                  result[i] ^= key[i % key_len]
              try:
                  return result.decode('utf-8').strip()
              except UnicodeDecodeError:
                  return result.decode('latin1').strip()

          def parse_smali_file(filepath):
              try:
                  with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
              except Exception:
                  return []

              # 1. Извлекаем все массивы :array_XXX
              arrays = {}
              array_pattern = re.compile(r':array_([a-zA-Z0-9_]+)\s*\.array-data \d+\s*((?:\s*-?\d+[a-zA-Z]*\s*)+)\s*\.end array-data', re.IGNORECASE | re.DOTALL)
              for match in array_pattern.finditer(content):
                  label = f":array_{match.group(1)}"
                  byte_list = []
                  for token in match.group(2).split():
                      clean_token = token.replace('t', '').replace('T', '')
                      try:
                          byte_list.append(int(clean_token))
                      except ValueError:
                          pass
                  arrays[label] = bytes(byte_list)

              results = []
              lines = content.split('\n')
              
              # 2. Ищем вызовы расшифровки
              invoke_pattern = re.compile(r'invoke-static \{(v\d+), (v\d+)\}, L(?:e0/m;->h|com/google/protobuf/q;->(?:i|l))\(')
              
              for i, line in enumerate(lines):
                  match = invoke_pattern.search(line)
                  if match:
                      reg1, reg2 = match.group(1), match.group(2)
                      data_array = key_array = None
                      
                      # 3. Ищем назад до 30 строк fill-array-data
                      for j in range(max(0, i - 30), i):
                          fill_match = re.search(r'fill-array-data (v\d+), (:\w+)', lines[j])
                          if fill_match:
                              reg, label = fill_match.group(1), fill_match.group(2)
                              if reg == reg1 and label in arrays:
                                  data_array = arrays[label]
                              elif reg == reg2 and label in arrays:
                                  key_array = arrays[label]
                      
                      # 4. Расшифровка
                      if data_array and key_array and len(data_array) > 0 and len(key_array) > 0:
                          decrypted = xor_decrypt(data_array, key_array)
                          if len(decrypted) > 1 and any(c.isprintable() for c in decrypted):
                              results.append({
                                  'file': filepath.replace('output_apktool/smali/', ''),
                                  'line': i + 1,
                                  'decrypted': repr(decrypted)
                              })
              return results

          def main():
              os.makedirs('decrypted_xor', exist_ok=True)
              all_results = []
              
              try:
                  with open('candidates.txt', 'r') as f:
                      files_to_process = [line.strip() for line in f if line.strip()]
              except FileNotFoundError:
                  print("❌ Файл candidates.txt не найден.")
                  return

              print(f"⚡ Обработка {len(files_to_process)} файлов...")
              for fp in files_to_process:
                  res = parse_smali_file(fp)
                  all_results.extend(res)

              # Убираем дубликаты
              seen = set()
              unique_results = []
              for r in all_results:
                  key = (r['file'], r['line'], r['decrypted'])
                  if key not in seen:
                      seen.add(key)
                      unique_results.append(r)

              unique_results.sort(key=lambda x: x['file'])

              with open('decrypted_xor/ALL_decrypted_FAST.txt', 'w', encoding='utf-8') as out:
                  out.write(f"✅ ВСЕГО НАЙДЕНО И РАСШИФРОВАНО: {len(unique_results)} уникальных строк\n\n")
                  out.write("=" * 80 + "\n")
                  for i, r in enumerate(unique_results, 1):
                      out.write(f"#{i:04d} | {r['file']}:{r['line']}\n")
                      out.write(f"🔓 {r['decrypted']}\n")
                      out.write("-" * 80 + "\n")

              print(f"💾 Готово! Результаты в decrypted_xor/ALL_decrypted_FAST.txt")

          if __name__ == "__main__":
              main()
          PYEOF
          
          python3 fast_decrypt.py

      - name: Commit и Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add decrypted_xor
          if ! git diff --staged --quiet; then
            git commit -m "chore: быстрая тотальная расшифровка XOR (grep + python)"
            git push
          else
            echo "⚠️ Новых расшифровок не найдено."
          fi

      - name: Очистка
        run: rm -f fast_decrypt.py candidates.txt
