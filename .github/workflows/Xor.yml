name: Smart XOR Decrypt v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Проверить наличие папок
        run: |
          if [ ! -d "output_jadx" ] || [ ! -d "output_apktool" ]; then
            echo "❌ Сначала запустите декомпиляцию (папки output_jadx и output_apktool отсутствуют)!"
            exit 1
          fi
          echo "✅ Папки найдены, начинаем анализ..."

      - name: Умная расшифровка XOR (v2)
        run: |
          cat > smart_xor_v2.py << 'PYEOF'
          import os, re

          def parse_bytes(byte_str):
              # Очищаем строку от мусора: 'new byte[]', '{', '}', пробелы
              clean = byte_str.replace('new byte[]', '').replace('{', '').replace('}', '').replace(' ', '').replace('\n', '').replace('\t', '')
              if not clean:
                  return b''
              try:
                  # Python отлично справляется с отрицательными числами: int('-29') = -29
                  return bytes([int(x) for x in clean.split(',')])
              except ValueError:
                  return b''

          def xor_decrypt(data, key):
              result = bytearray(data)
              key_len = len(key)
              for i in range(len(result)):
                  result[i] ^= key[i % key_len]
              try:
                  return result.decode('utf-8').strip()
              except UnicodeDecodeError:
                  return result.decode('latin1').strip()

          def main():
              os.makedirs('decrypted_xor', exist_ok=True)
              results = []
              
              # Гибкий regex: ловит h( new byte[]{...} , new byte[]{...} ) 
              # или m.h( ... ), даже с переносами строк внутри
              pattern = re.compile(r'(?:m\.)?h\s*\(\s*new\s+byte\[\]\s*\{([^}]+)\}\s*,\s*new\s+byte\[\]\s*\{([^}]+)\}\s*\)', re.MULTILINE | re.DOTALL)

              java_dir = 'output_jadx/sources'
              if not os.path.exists(java_dir):
                  print(f"❌ Директория {java_dir} не найдена!")
                  return

              file_count = 0
              for root, _, files in os.walk(java_dir):
                  for file in files:
                      if not file.endswith('.java'):
                          continue
                      file_count += 1
                      fp = os.path.join(root, file)
                      try:
                          with open(fp, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          
                          for match in pattern.finditer(content):
                              data_str = match.group(1)
                              key_str = match.group(2)
                              
                              data_bytes = parse_bytes(data_str)
                              key_bytes = parse_bytes(key_str)
                              
                              if len(data_bytes) > 0 and len(key_bytes) > 0:
                                  decrypted = xor_decrypt(data_bytes, key_bytes)
                                  
                                  # Фильтр: длина > 1 и есть хотя бы один печатный символ
                                  if len(decrypted) > 1 and any(c.isprintable() for c in decrypted):
                                      line_num = content[:match.start()].count('\n') + 1
                                      rel_path = fp.replace(java_dir + '/', '')
                                      results.append({
                                          'file': rel_path,
                                          'line': line_num,
                                          'decrypted': repr(decrypted) # repr покажет \n, \t и пробелы
                                      })
                      except Exception as e:
                          print(f"⚠️ Ошибка в {fp}: {e}")

              print(f"🔍 Просканировано файлов: {file_count}")
              print(f"✅ Найдено расшифровок: {len(results)}")
              
              with open('decrypted_xor/real_decrypted.txt', 'w', encoding='utf-8') as out:
                  out.write(f"✅ Успешно расшифровано: {len(results)} строк\n\n")
                  for i, r in enumerate(results, 1):
                      out.write(f"#{i} | {r['file']}:{r['line']}\n")
                      out.write(f"🔓 {r['decrypted']}\n")
                      out.write("-" * 70 + "\n")

          if __name__ == "__main__":
              main()
          PYEOF
          
          python3 smart_xor_v2.py

      - name: Commit и Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add decrypted_xor
          if ! git diff --staged --quiet; then
            git commit -m "chore: умная расшифровка XOR v2 (исправлен парсинг)"
            git push
          else
            echo "⚠️ Изменений нет, возможно, строки уже были расшифрованы или паттерн не найден."
          fi

      - name: Очистка
        run: rm -f smart_xor_v2.py
